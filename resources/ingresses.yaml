---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: freshrss
  namespace: freshrss
  annotations:
    external-dns.alpha.kubernetes.io/hostname: rss.crt.lol
    external-dns.alpha.kubernetes.io/target: rss.crt.lol
spec:
  ingressClassName: nginx-external
  rules:
    - host: "rss.crt.lol"
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: freshrss
                port:
                  number: 80
  tls:
    - hosts:
      - rss.crt.lol
